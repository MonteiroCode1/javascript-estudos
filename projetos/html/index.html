<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Cadastro de Alunos</title>
</head>
<body>
    <header>
        <h1>Sistema de Cadastro de Alunos</h1>
    </header>
    <form>
        <p>
            <label for="inNome">Nome:</label>
            <input type="text" id="inNome" required autofocus>
        </p>
        <p>
            <label for="inMatricula">Matricula:</label>
            <input type="number" id="inMatricula" required>
        </p>
        <p>
            <label for="inTelefone">Telefone:</label>
            <input type="number" id="inTelefone" required>
        </p>
        <p>
            <input type="submit" value="Cadastrar &#128196;" id="inCadastrar">
            <input type="button" value="Selecionar &#9989;" id="inListar">
            <input type="button" value="Remover &#10060;" id="inRemover">
            <input type="button" value="Pesquisar &#128269;" id="inPesquisa">
        </p>
    </form>
    <script src="../javascript/script.js"></script>
</body>
</html>
