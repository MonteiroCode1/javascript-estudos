<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <title>ex11_1.html</title>
    <style>
        body {
            background-color: rgb(214, 214, 214);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-4">
                <img src="img/ex11_1.png" alt="Jockey Club" class="img-fluid">
            </div>
            <div class="col-sm-8">
                <h1>Jockey club - controle de apostas</h1>
                <form>
                    <div class="row">
                        <div class="col-sm-6">
                            <label for="inCavalo">N° Cavalo:</label>
                            <input type="number" class="form-control" id="inCavalo" required autofocus>
                        </div>
                        <div class="col-ms-6">
                            <h5 id="outCavalo" class="mt-4"></h5>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-ms-6">
                            <label for="inValor">Aposta R$:</label>
                            <input type="number" min="1" step="0.5" class="form-control" id="inValor" required>
                        </div>
                        <div class="col-sm-6">
                            <input type="submit" value="Apostar" class="btn btn-primary" id="btApostar">
                            <input type="button" value="Resumo" class="btn btn-warning" id="btResumo">
                            <input type="button" value="Ganhador" class="btn btn-success" id="btGanhador">
                            <input type="button" value="Novo Pareo" class="btn btn-danger" id="btNovo">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
<script src="../javascript/ex11_1.js"></script>
</body>
</html>
